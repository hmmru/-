<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD MASTER EDITOR (ALIGN FIXED)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&family=Noto+Sans+KR:wght@300;500;700&display=swap">
    <style>
        /* 편집기 UI */
        body { background: #0a000a; margin: 0; display: flex; height: 100vh; font-family: 'Noto Sans KR', sans-serif; color: #fff; overflow: hidden; }
        .editor-panel { width: 450px; background: #1a111a; border-right: 1px solid #3d1c2d; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .preview-panel { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; overflow: auto; background: #000; }
        .editor-panel h2 { font-family: 'Rajdhani'; color: var(--main-color); font-size: 1.2rem; margin-bottom: 20px; border-bottom: 2px solid var(--main-color); padding-bottom: 10px; }
        .edit-group { margin-bottom: 18px; padding-bottom: 15px; border-bottom: 1px solid #2a1a2a; }
        .edit-group label { display: block; font-size: 11px; color: var(--main-color); font-family: 'Share Tech Mono'; margin-bottom: 6px; letter-spacing: 1px; }
        .edit-group input, .edit-group textarea { width: 100%; background: #2a1a2a; border: 1px solid #4a2a3a; color: #fff; padding: 10px; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .row { display: flex; gap: 8px; margin-bottom: 5px; }
        .btn-extract { width: 100%; padding: 15px; background: var(--main-color); color: #fff; border: none; border-radius: 6px; font-family: 'Rajdhani'; font-weight: 700; cursor: pointer; margin-top: 10px; }

        :root { --main-color: #ff4d8d; --main-rgb: 255, 77, 141; }

        /* [HUD 디자인 - 정렬 및 밀림 방지] */
        .hud-wrapper { width: 480px; background: rgba(10, 0, 10, 0.95); font-family: 'Rajdhani', sans-serif; border-radius: 12px; border: 2px solid var(--main-color); position: relative; color: #fff; }
        .hud-header { padding: 24px; border-bottom: 1px solid rgba(var(--main-rgb), 0.5); position: relative; }
        .category-tag { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--main-color); letter-spacing: 2px; }
        .subject { font-size: 1.5rem; font-weight: 700; margin: 12px 0; }
        
        .hud-body { padding: 24px; }
        
        /* 밀림 현상 방지: profile-viewer에 명시적 높이와 기준점 설정 */
        .profile-viewer { position: relative; margin-bottom: 24px; width: 100%; }
        .image-card { width: 100%; border-radius: 4px; overflow: hidden; border: 1px solid rgba(var(--main-rgb), 0.5); background: #000; position: relative; }
        .image-card img { width: 100%; height: auto; display: block; }
        
        /* 글자 밀림 해결: 앵커 포인트를 명확하게 잡고 padding으로 조절 */
        .rank-overlay { 
            position: absolute; 
            bottom: 10px; 
            right: 10px; 
            background: var(--main-color); 
            color: #fff; 
            padding: 4px 12px; 
            font-size: 0.85rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            white-space: nowrap; /* 줄바꿈 방지 */
            display: inline-block;
            border-radius: 2px;
            z-index: 50;
        }

        .info-section { display: grid; gap: 16px; }
        .info-item { border-left: 2px solid rgba(var(--main-rgb), 0.4); padding-left: 12px; }
        .info-label { font-family: 'Share Tech Mono'; font-size: 11px; color: var(--main-color); }
        .info-value { font-size: 0.95rem; margin-top: 4px; }
        
        .hazard-notice { margin-top: 30px; padding: 15px; background: rgba(var(--main-rgb), 0.1); border: 1px solid var(--main-color); position: relative; }
        .hazard-notice::before { content: ""; position: absolute; left: 0; top: 0; width: 6px; height: 100%; background: var(--main-color); }
        .hazard-title { font-family: 'Share Tech Mono'; font-size: 12px; color: var(--main-color); margin-bottom: 5px; padding-left: 10px; }
        .hazard-desc { font-size: 13px; padding-left: 10px; color: #eee; }
    </style>
</head>
<body>

<div class="editor-panel">
    <h2>HUD_MASTER_EDITOR</h2>
    <div class="edit-group">
        <label>POINT COLOR</label>
        <input type="color" id="c-master" value="#ff4d8d" oninput="up()">
    </div>
    <div class="edit-group">
        <label>IMAGE URL</label>
        <input type="text" id="i-url" placeholder="URL 입력..." oninput="up()">
    </div>
    <div class="edit-group">
        <label>TEXT EDIT</label>
        <input type="text" id="t-rank" value="S+ CLASS" oninput="up()" style="margin-bottom:5px">
        <input type="text" id="t-v1" value="코드네임: 러브 (LOVE)" oninput="up()">
    </div>
    <button class="btn-extract" onclick="fixedDown()">EXTRACT JPG (FIXED)</button>
</div>

<div class="preview-panel">
    <div class="hud-wrapper" id="hud">
        <div class="hud-header">
            <span class="category-tag">addressee::GREMORY</span>
            <div class="subject">SENTINEL-FILE: LOVE</div>
        </div>
        <div class="hud-body">
            <div class="profile-viewer">
                <div class="image-card">
                    <img id="o-img" src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2Fbya9Kl%2FdJMb990uNuJ%2FAAAAAAAAAAAAAAAAAAAAAFeCHaSgua63DKc4ITZvKgwFVyQg-LCcRd-Vo9Q_RRUa%2Fimg.jpg%3Fcredential%3DyqXZFxpELC7KVnFOS48ylbz2pIh7yKj8%26expires%3D1777561199%26allow_ip%3D%26allow_referer%3D%26signature%3DqpLmcdo8J2uD17Vny5GWYtRs400%253D">
                    <div class="rank-overlay" id="o-rank">S+ CLASS</div>
                </div>
            </div>
            <div class="info-section">
                <div class="info-item">
                    <div class="info-label">IDENTIFIER</div>
                    <div class="info-value" id="o-v1">코드네임: 러브 (LOVE)</div>
                </div>
            </div>
            <div class="hazard-notice">
                <div class="hazard-title">⚠️ CRITICAL RISK</div>
                <div class="hazard-desc">정서 초토화 주의 대상.</div>
            </div>
        </div>
    </div>
</div>

<script>
    function up() {
        const color = document.getElementById('c-master').value;
        document.documentElement.style.setProperty('--main-color', color);
        if(document.getElementById('i-url').value) document.getElementById('o-img').src = document.getElementById('i-url').value;
        document.getElementById('o-rank').innerText = document.getElementById('t-rank').value;
        document.getElementById('o-v1').innerText = document.getElementById('t-v1').value;
    }

    // [핵심 수정] 폰트 로딩 대기 후 캡처
    async function fixedDown() {
        const hud = document.getElementById('hud');
        
        // 1. 폰트가 로드될 때까지 명시적으로 대기
        await document.fonts.ready;
        
        // 2. dom-to-image 실행 전 렌더링을 위해 아주 짧은 지연시간 부여
        setTimeout(() => {
            domtoimage.toJpeg(hud, { 
                quality: 0.95,
                bgcolor: '#000',
                style: {
                    'transform': 'scale(1)',
                    'transform-origin': 'top left'
                }
            })
            .then(url => {
                const l = document.createElement('a');
                l.download = 'hud_fixed.jpg';
                l.href = url;
                l.click();
            });
        }, 100); 
    }

    up();
</script>
</body>
</html>
