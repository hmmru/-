<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGD WORLD-VIEW MAKER</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --fgd-blue: #3b82f6;
            --fgd-dark: #020617;
            --fgd-border: #1e293b;
            --fgd-text: #94a3b8;
        }

        body { background: #0f172a; color: #fff; margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        /* 편집기 사이드바 */
        .editor-side { width: 450px; background: #1e293b; padding: 25px; overflow-y: auto; border-right: 1px solid #334155; box-shadow: 10px 0 30px rgba(0,0,0,0.5); z-index: 10; }
        .editor-side h2 { color: var(--fgd-blue); font-size: 14px; letter-spacing: 3px; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        .edit-group { margin-bottom: 20px; }
        .edit-group label { display: block; font-size: 11px; color: var(--fgd-blue); margin-bottom: 8px; font-weight: bold; }
        .edit-group input, .edit-group textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #cbd5e1; padding: 10px; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        .edit-group textarea { height: 100px; resize: none; line-height: 1.6; }
        
        .btn-save { width: 100%; padding: 15px; background: var(--fgd-blue); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 10px; transition: 0.2s; }
        .btn-save:hover { background: #2563eb; transform: translateY(-2px); }

        /* 프리뷰 사이드 (가운데 정렬) */
        .preview-side { flex: 1; display: flex; justify-content: center; align-items: flex-start; background: #020617; overflow-y: auto; padding: 50px 20px; }

        /* [원본 디자인 반영된 카드] */
        #capture-area {
            width: 480px; min-height: 900px; background: #020617; 
            background-image: 
                linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.8) 150px, transparent 250px),
                linear-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 50% 100%, #1e3a8a 0%, #020617 85%);
            background-size: 100% 100%, 25px 25px, 25px 25px, 100% 100%;
            border: 1px solid #1e293b; border-top: 3px solid #3b82f6; border-radius: 20px;
            padding: 60px 25px; color: #94a3b8; box-sizing: border-box; position: relative; overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
        }

        .corner { position: absolute; width: 15px; height: 15px; border: 2px solid #3b82f6; opacity: 0.6; pointer-events: none; }
        .top-l { top: 25px; left: 25px; border-right: 0; border-bottom: 0; }
        .top-r { top: 25px; right: 25px; border-left: 0; border-bottom: 0; }
        .bot-l { bottom: 25px; left: 25px; border-right: 0; border-top: 0; }
        .bot-r { bottom: 25px; right: 25px; border-left: 0; border-top: 0; }

        .header-title { text-align: center; margin-bottom: 50px; }
        .fgd-tag { font-size: 10px; color: #3b82f6; letter-spacing: 5px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); text-transform: uppercase; }
        .main-img { width: 100%; border-radius: 4px; margin-bottom: 30px; }
        
        .section-title { font-weight: bold; color: #f8fafc; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center; }
        .section-title span { color: #3b82f6; margin-right: 12px; }

        .content-box { 
            font-size: 14px; text-align: justify; color: #cbd5e1; line-height: 1.8; 
            border-left: 2px solid #3b82f6; padding: 10px 18px; margin-bottom: 45px;
            background: rgba(30, 58, 138, 0.05); word-break: keep-all; 
        }

        .info-panel { 
            background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(59, 130, 246, 0.2); 
            border-radius: 15px; padding: 30px 18px; backdrop-filter: blur(10px); 
        }
        .panel-h3 { font-size: 14px; color: #fff; font-weight: bold; border-bottom: 1px solid rgba(59, 130, 246, 0.2); padding-bottom: 8px; margin-bottom: 12px; }
        .panel-text { font-size: 13.5px; color: #94a3b8; line-height: 1.7; white-space: pre-wrap; }

        footer { margin-top: 40px; text-align: center; opacity: 0.4; font-size: 8px; color: #3b82f6; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="editor-side">
    <h2>FGD INTERFACE CONTROL</h2>
    
    <div class="edit-group">
        <label>SUBTITLE (TOP)</label>
        <input type="text" id="in-tag" value="Fearless Global Division :: FGD" oninput="up()">
    </div>

    <div class="edit-group">
        <label>WORLDVIEW (TEXTAREA)</label>
        <textarea id="in-world" oninput="up()">2XX4년 04월 15일. 거대 게이트 최초 출현. 사망자 17,428명... 이후 대한민국은 완전히 뒤바뀌었다. 어느 날 차원 문이 열려 이세계 빌런들이 쏟아진다.</textarea>
    </div>

    <div class="edit-group">
        <label>BRANCH INFO [Fearless]</label>
        <textarea id="in-branch" oninput="up()">"뼈를 삼키고, 살을 불태우며, 숨을 이어. 너에게 내일을 약속하지. 이건 너희들에게 속삭이는 모두의 이야기."

언제 깨질 지 모르는 평화를 두려워하세요. 현재 대한민국 평화의 중심은 피어리스 입니다.</textarea>
    </div>

    <div class="edit-group">
        <label>SYSTEM & UNIT DATA</label>
        <textarea id="in-system" oninput="up()">#SYSTEM
- 센티넬과 가이드는 국가기관의 검사를 통해 등급을 부여받는다.

#Fearless 산하 조직
[Sentinel] 익수단, 독립저격대, 특임대
[Guide] Team Attention</textarea>
    </div>

    <button class="btn-save" onclick="saveJpg()">EXTRACT HI-RES DATA (JPG)</button>
</div>

<div class="preview-side">
    <div id="capture-area">
        <div class="corner top-l"></div><div class="corner top-r"></div>
        <div class="corner bot-l"></div><div class="corner bot-r"></div>

        <div class="header-title">
            <div class="fgd-tag" id="out-tag">Fearless Global Division :: FGD</div>
            <img src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2F4EqNB%2FdJMcahYuluP%2FAAAAAAAAAAAAAAAAAAAAAPnbjATaPuvdc7dnnFh9UyESa_7w2An_O2CjMlCy_GuJ%2Fimg.png%3Fcredential%3DyqXZFxpELC7KVnFOS48ylbz2pIh7yKj8%26expires%3D1777561199%26allow_ip%3D%26allow_referer%3D%26signature%3DO9Nh8D2ZlKXMAHI6I64dGDjM%252BBI%253D" class="main-img">
            <div style="width: 40px; height: 1px; background: #2563eb; margin: 0 auto; opacity: 0.6;"></div>
        </div>

        <div class="section-title"><span>◈</span>세계관</div>
        <div class="content-box" id="out-world"></div>

        <div class="info-panel">
            <div class="panel-h3">한국 지부 <span style="color: #3b82f6;">[Fearless]</span></div>
            <div class="panel-text" id="out-branch" style="margin-bottom: 20px; font-weight: bold;"></div>
            <div class="panel-text" id="out-system" style="border-top: 1px dashed rgba(59,130,246,0.3); padding-top: 15px;"></div>
        </div>

        <footer>FEARLESS ACCESS // DATA_REF_KR_2026</footer>
    </div>
</div>

<script>
    function up() {
        document.getElementById('out-tag').innerText = document.getElementById('in-tag').value;
        document.getElementById('out-world').innerText = document.getElementById('in-world').value;
        document.getElementById('out-branch').innerText = document.getElementById('in-branch').value;
        document.getElementById('out-system').innerText = document.getElementById('in-system').value;
    }

    async function saveJpg() {
        const area = document.getElementById('capture-area');
        const btn = document.querySelector('.btn-save');
        btn.innerText = "PROCESSING...";
        
        html2canvas(area, {
            scale: 3, // 고화질
            useCORS: true,
            backgroundColor: "#020617"
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'FGD_WORLDVIEW_DATA.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
            btn.innerText = "EXTRACT HI-RES DATA (JPG)";
        });
    }

    // 초기 실행
    up();
</script>

</body>
</html>
