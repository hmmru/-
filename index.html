<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S+ CLASS SENTINEL EDITOR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;500;700&display=swap">
    <style>
        /* [설정창 스타일] */
        :root {
            --panel-bg: #ffffff;
            --panel-text: #333333;
            --main-color: #ff6b81; /* 초기값 */
            --sub-color: #ffb7c5;
            --bg-opacity: 0.7;
        }

        body.dark-mode-ui {
            --panel-bg: #1a1a1a;
            --panel-text: #eeeeee;
        }

        body {
            background: #e0e0e0;
            margin: 0;
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 왼쪽 컨트롤 패널 */
        .editor-panel {
            width: 350px;
            background: var(--panel-bg);
            color: var(--panel-text);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 100;
            height: 100vh;
            overflow-y: auto;
        }

        .editor-panel h2 { font-family: 'Orbitron'; font-size: 1.2rem; margin-bottom: 20px; border-bottom: 2px solid var(--main-color); padding-bottom: 10px; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; opacity: 0.8; }
        .control-group input[type="text"], .control-group textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; background: transparent; color: inherit; }
        .control-group textarea { height: 80px; resize: none; }
        
        .color-presets { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
        .color-dot { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.active { border-color: #000; }

        .btn-save { width: 100%; padding: 12px; background: var(--main-color); color: white; border: none; border-radius: 5px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; margin-top: 20px; }

        /* 오른쪽 결과물 영역 */
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #ccc;
            overflow: auto;
        }

        /* [기존 카드 스타일 유지/수정] */
        .card {
            width: 100%;
            max-width: 440px;
            height: 850px;
            background-image: url('https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2FROJ4l%2FdJMcahqFXch%2FAAAAAAAAAAAAAAAAAAAAAAdaYEl4L8uhdG797Zy6lZ5U65Jz6l_xA9JKpxVVcjX6%2Fimg.png%3Fcredential%3DyqXZFxpELC7KVnFOS48ylbz2pIh7yKj8%26expires%3D1777561199%26allow_ip%3D%26allow_referer%3D%26signature%3Do3rlTvBn4M9R8gH%252FPx7KDCEZFZs%253D');
            background-size: cover;
            background-position: center;
            border: 1px solid var(--main-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card::before {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(var(--main-color) 0.5px, transparent 0.5px), linear-gradient(90deg, var(--main-color) 0.5px, transparent 0.5px);
            background-size: 20px 20px; z-index: 0; opacity: 0.1;
        }

        .overlay {
            position: absolute; inset: 0;
            background: rgba(255, 255, 255, var(--bg-opacity));
            display: flex; flex-direction: column;
            backdrop-filter: saturate(140%); z-index: 1;
            transition: background 0.3s;
        }

        /* 다크모드 카드용 클래스 */
        .card.dark-theme .overlay { background: rgba(0, 0, 0, var(--bg-opacity)); color: white; }
        .card.dark-theme .value { color: #eee !important; }

        .overlay::before, .overlay::after, .card::after { content: ''; position: absolute; width: 15px; height: 15px; border: 2px solid var(--main-color); z-index: 10; }
        .overlay::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
        .overlay::after { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
        .card::after { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

        header { padding: 30px 30px 15px; border-bottom: 1px solid var(--main-color); position: relative; }
        .sys-log { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--main-color); letter-spacing: 2px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .sys-load-bar { width: 60px; height: 2px; background: var(--main-color); opacity: 0.2; position: relative; overflow: hidden; }
        .sys-load-bar::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: var(--main-color); animation: loading 2s infinite ease-in-out; }
        
        .grade { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--main-color); font-weight: 800; }
        .code-name-wrap { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; color: var(--main-color); font-weight: 900; margin: 0; }

        main { flex: 1; padding: 25px 30px; overflow-y: auto; background-image: repeating-linear-gradient(0deg, var(--main-color) 0px, var(--main-color) 0.5px, transparent 0.5px, transparent 3px); background-size: 100% 4px; }
        .quote-card-unit { margin-bottom: 30px; position: relative; padding: 18px 20px; background: rgba(127, 127, 127, 0.05); border: 1px solid rgba(127, 127, 127, 0.2); }
        .card-catch { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--main-color); font-weight: 800; display: block; margin-bottom: 6px; }
        .card-quote { font-size: 0.95rem; color: var(--main-color); font-weight: 700; line-height: 1.5; }
        
        .label { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--main-color); font-weight: 800; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .label::after { content: ''; height: 1px; flex: 1; background: linear-gradient(90deg, var(--main-color), transparent); }
        .value { font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif; font-size: 0.92rem; color: #111; line-height: 1.6; padding-left: 8px; margin-bottom: 20px; }
        
        .ability-box { background: rgba(127, 127, 127, 0.08); border: 1px solid var(--main-color); padding: 18px; position: relative; }
        footer { padding: 15px 30px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--main-color); display: flex; justify-content: space-between; background: rgba(127, 127, 127, 0.05); }

        @keyframes loading { 0% { left: -100%; } 50% { left: 100%; } 100% { left: 100%; } }
        @media (max-width: 768px) { body { flex-direction: column; } .editor-panel { width: 100%; height: auto; } }
    </style>
</head>
<body>

<div class="editor-panel">
    <h2>UNIT EDITOR</h2>
    
    <div class="control-group">
        <label>1. 배경 이미지 URL</label>
        <input type="text" id="bgInput" placeholder="이미지 주소 붙여넣기" oninput="updateUI()">
    </div>

    <div class="control-group">
        <label>2. 코드네임</label>
        <input type="text" id="nameInput" value="LOVE" oninput="updateUI()">
    </div>

    <div class="control-group">
        <label>3. 본문 쿼트</label>
        <textarea id="quoteInput" oninput="updateUI()">"어쩌고"</textarea>
    </div>

    <div class="control-group">
        <label>4. 테마 컬러</label>
        <div class="color-presets">
            <div class="color-dot" style="background:#ff6b81" onclick="changeColor('#ff6b81')"></div>
            <div class="color-dot" style="background:#ff9f43" onclick="changeColor('#ff9f43')"></div>
            <div class="color-dot" style="background:#feca57" onclick="changeColor('#feca57')"></div>
            <div class="color-dot" style="background:#1dd1a1" onclick="changeColor('#1dd1a1')"></div>
            <div class="color-dot" style="background:#48dbfb" onclick="changeColor('#48dbfb')"></div>
            <div class="color-dot" style="background:#5f27cd" onclick="changeColor('#5f27cd')"></div>
            <input type="color" id="customColor" onchange="changeColor(this.value)" style="width:30px; height:30px; border:none; padding:0; background:none;">
        </div>
    </div>

    <div class="control-group">
        <label>5. 스크린 투명도 (Opacity)</label>
        <input type="range" id="opacityInput" min="0" max="1" step="0.1" value="0.7" oninput="updateUI()">
    </div>

    <div class="control-group">
        <label>6. 다크 / 화이트 테마</label>
        <select id="themeSelect" onchange="updateUI()" style="width:100%; padding:8px;">
            <option value="white">White Theme</option>
            <option value="dark">Dark Theme</option>
        </select>
    </div>

    <button class="btn-save" onclick="saveAsImage()">DOWNLOAD PNG</button>
</div>

<div class="preview-area">
    <div class="card" id="export-card">
        <div class="overlay">
            <header>
                <div class="sys-log"><span>Fearless&bull;HQ</span><div class="sys-load-bar"></div></div>
                <div class="title-box">
                    <span class="grade">S+ CLASS SENTINEL</span>
                    <h1 class="code-name-wrap" id="view-name">CODE NAME: LOVE</h1>
                </div>
            </header>
            <main>
                <div class="quote-card-unit">
                    <span class="card-catch">// SYSTEM_QUOTE</span>
                    <p class="card-quote" id="view-quote">"어쩌고"</p>
                </div>
                <div class="data-row"><span class="label">BASIC_INFO</span><div class="value">연하진 / 26세 / 남성 / 센티넬</div></div>
                <div class="data-row"><span class="label">APPEARANCE</span><div class="value">키 181cm. 마른 편이지만 탄탄하고 유연한 몸...</div></div>
                <div class="data-row">
                    <span class="label">ABILITY_SPEC</span>
                    <div class="ability-box">
                        <div class="value" style="font-weight: bold; color: var(--main-color);">[ Heart Manifestation ]</div>
                        <div class="value">전투시작 시, 손끝에서 형성되는 핑크빛 에너지체...</div>
                    </div>
                </div>
            </main>
            <footer><span>STATUS: STABLE</span><span>ENCRYPTION: ACTIVE</span></footer>
        </div>
    </div>
</div>

<script>
    function updateUI() {
        // 1. 텍스트 업데이트
        document.getElementById('view-name').innerText = "CODE NAME: " + document.getElementById('nameInput').value;
        document.getElementById('view-quote').innerText = document.getElementById('quoteInput').value;

        // 2. 이미지 업데이트
        const bgUrl = document.getElementById('bgInput').value;
        if(bgUrl) document.getElementById('export-card').style.backgroundImage = `url('${bgUrl}')`;

        // 3. 투명도 업데이트
        const opacity = document.getElementById('opacityInput').value;
        document.documentElement.style.setProperty('--bg-opacity', opacity);

        // 4. 다크/화이트 테마
        const theme = document.getElementById('themeSelect').value;
        const card = document.getElementById('export-card');
        if(theme === 'dark') {
            card.classList.add('dark-theme');
            document.body.classList.add('dark-mode-ui');
        } else {
            card.classList.remove('dark-theme');
            document.body.classList.remove('dark-mode-ui');
        }
    }

    function changeColor(color) {
        document.documentElement.style.setProperty('--main-color', color);
        updateUI();
    }

    function saveAsImage() {
        const target = document.getElementById('export-card');
        domtoimage.toPng(target, { quality: 1.0 })
            .then(function (dataUrl) {
                const link = document.createElement('a');
                link.download = 'sentinel-card.png';
                link.href = dataUrl;
                link.click();
            })
            .catch(function (error) {
                alert('저장 실패! 이미지 URL이 외부 링크인 경우 보안상 캡처가 안 될 수 있습니다.');
            });
    }
</script>

</body>
</html>
