<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S+ CLASS SENTINEL EDITOR (PRO)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;500;700&display=swap">
    <style>
        /* [편집기 UI 스타일 - 화이트 고정] */
        :root {
            --ui-bg: #f5f7fa;
            --ui-sidebar: #ffffff;
            --ui-text: #2d3436;
            --ui-border: #dfe6e9;
        }

        body {
            background: var(--ui-bg);
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--ui-text);
        }

        .editor-panel {
            width: 380px; background: var(--ui-sidebar);
            padding: 25px; border-right: 1px solid var(--ui-border);
            z-index: 100; overflow-y: auto; box-sizing: border-box;
        }

        .header-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .editor-panel h2 { font-family: 'Orbitron'; font-size: 1rem; color: #ff6b81; margin: 0; }
        
        .mode-toggle {
            padding: 6px 12px; font-size: 10px; font-family: 'Orbitron'; border-radius: 4px;
            border: 1px solid #ff6b81; background: transparent; color: #ff6b81; cursor: pointer;
        }
        .mode-toggle:hover { background: #ff6b81; color: white; }

        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-size: 11px; font-weight: bold; color: #888; margin-bottom: 5px; }
        .control-group input, .control-group textarea { 
            width: 100%; padding: 10px; border: 1px solid var(--ui-border); border-radius: 6px; 
            background: #fff; color: #333; box-sizing: border-box; font-size: 0.9rem;
        }
        .control-group textarea { height: 60px; resize: none; }

        .btn-save { 
            width: 100%; padding: 15px; background: #ff6b81; color: #fff; border: none; 
            border-radius: 6px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; margin-top: 10px;
        }

        .preview-area { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: auto; background: #e0e0e0; }

        /* =========================================
           [카드 코드 - 님이 준 원본 절대 보존]
           ========================================= */
        :root {
            --bg-opacity: 0.7; 
            --main-color: #ff6b81;
            --sub-color: #ffb7c5;
            /* 카드 모드용 변수 */
            --card-bg: rgba(255, 255, 255, var(--bg-opacity));
            --card-text: #111;
        }

        /* [카드 다크모드 적용 시] */
        .card-dark-mode {
            --card-bg: rgba(0, 0, 0, var(--bg-opacity));
            --card-text: #eee;
        }

        .card {
            width: 100%; max-width: 440px; height: 850px; margin: auto;
            background-image: url('https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2FROJ4l%2FdJMcahqFXch%2FAAAAAAAAAAAAAAAAAAAAAAdaYEl4L8uhdG797Zy6lZ5U65Jz6l_xA9JKpxVVcjX6%2Fimg.png%3Fcredential%3DyqXZFxpELC7KVnFOS48ylbz2pIh7yKj8%26expires%3D1777561199%26allow_ip%3D%26allow_referer%3D%26signature%3Do3rlTvBn4M9R8gH%252FPx7KDCEZFZs%253D');
            background-size: cover; background-position: center;
            border: 1px solid var(--main-color); position: relative; overflow: hidden; display: flex; flex-direction: column;
        }

        .card::before {
            content: ''; position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255, 107, 129, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 107, 129, 0.05) 1px, transparent 1px);
            background-size: 20px 20px; z-index: 0;
        }

        .overlay {
            position: absolute; inset: 0;
            background: var(--card-bg); /* 모드에 따라 변경 */
            display: flex; flex-direction: column; backdrop-filter: saturate(140%); z-index: 1;
            transition: background 0.3s;
        }

        .overlay::before, .overlay::after, .card::after {
            content: ''; position: absolute; width: 15px; height: 15px; border: 2px solid var(--main-color); z-index: 10;
        }
        .overlay::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
        .overlay::after { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
        .card::after { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

        header { padding: 30px 30px 15px; border-bottom: 1px solid var(--main-color); position: relative; }
        .sys-log { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--main-color); letter-spacing: 2px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .sys-load-bar { width: 60px; height: 2px; background: rgba(255, 107, 129, 0.15); position: relative; overflow: hidden; }
        .sys-load-bar::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: var(--main-color); animation: loading 2s infinite ease-in-out; }
        
        .title-box { display: flex; flex-direction: column; gap: 0 !important; }
        .grade { font-family: 'Orbitron'; font-size: 0.75rem; color: var(--main-color); font-weight: 800; letter-spacing: 1px; line-height: 1; margin: 0 !important; }
        .code-name-wrap { font-family: 'Orbitron'; font-size: 1.6rem; color: var(--main-color); font-weight: 900; line-height: 1; margin: 0 !important; }

        main { flex: 1; padding: 25px 30px; overflow-y: auto; background-image: repeating-linear-gradient(0deg, rgba(255, 107, 129, 0.02) 0px, rgba(255, 107, 129, 0.02) 1px, transparent 1px, transparent 3px); }
        main::-webkit-scrollbar { width: 2px; }
        main::-webkit-scrollbar-thumb { background: var(--main-color); }

        .quote-card-unit { margin-bottom: 30px; position: relative; padding: 18px 20px; background: rgba(255, 107, 129, 0.05); border: 1px solid rgba(255, 107, 129, 0.2); }
        .quote-card-unit::before, .quote-card-unit::after { content: ''; position: absolute; width: 8px; height: 8px; border: 2px solid var(--main-color); }
        .quote-card-unit::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
        .quote-card-unit::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
        .card-catch { font-family: 'JetBrains Mono'; font-size: 9px; color: var(--main-color); font-weight: 800; display: block; margin-bottom: 6px; opacity: 0.7; }
        .card-quote { font-size: 0.95rem; color: var(--main-color); font-weight: 700; line-height: 1.5; }

        .label { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--main-color); font-weight: 800; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .label::before { content: '◢'; font-size: 7px; margin-right: -5px; }
        .label::after { content: ''; height: 1px; flex: 1; background: linear-gradient(90deg, var(--main-color), transparent); }
        
        .value { 
            font-family: 'JetBrains Mono', 'Noto Sans KR'; font-size: 0.92rem; 
            color: var(--card-text); /* 모드 전환 영향 */
            line-height: 1.8; padding-left: 8px; text-align: justify; transition: color 0.3s;
        }

        .ability-box { background: rgba(255, 107, 129, 0.08); border: 1px solid var(--sub-color); padding: 18px; margin-top: 8px; position: relative; }
        .ability-box::after { content: 'POWER_DATA'; position: absolute; bottom: -7px; right: 8px; font-family: 'JetBrains Mono'; font-size: 8px; background: var(--main-color); color: #fff; padding: 0 4px; }

        footer { padding: 15px 30px; font-family: 'JetBrains Mono'; font-size: 9px; color: var(--main-color); display: flex; justify-content: space-between; background: rgba(255, 107, 129, 0.05); }
        .sys-beat { width: 4px; height: 4px; background: var(--main-color); animation: blink 1s infinite steps(1); }

        @keyframes loading { 0% { left: -100%; } 100% { left: 100%; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="editor-panel">
    <div class="header-wrap">
        <h2>CARD_STATION</h2>
        <button class="mode-toggle" onclick="toggleCardMode()">CARD MODE</button>
    </div>
    
    <div class="control-group"><label>IMG_SRC</label><input type="file" accept="image/*" onchange="handleFile(this)"></div>
    <div class="control-group"><label>TAG</label><input type="text" id="affilInput" value="Fearless•HQ" oninput="updateUI()"></div>
    <div class="control-group"><label>GRADE</label><input type="text" id="gradeInput" value="S+ CLASS SENTINEL" oninput="updateUI()"></div>
    <div class="control-group"><label>IDENTITY</label><input type="text" id="nameInput" value="CODE NAME: LOVE" oninput="updateUI()"></div>
    <div class="control-group"><label>SYSTEM_QUOTE</label><textarea id="quoteInput" oninput="updateUI()">"어쩌고"</textarea></div>
    
    <div class="control-group">
        <label>UNIT_DATA</label>
        <textarea id="appInput" oninput="updateUI()" placeholder="APPEARANCE">키 181cm...</textarea>
        <textarea id="persInput" oninput="updateUI()" style="margin-top:5px;" placeholder="PERSONALITY">태생적으로 사랑받는...</textarea>
    </div>

    <div class="control-group">
        <label>OPACITY / COLOR</label>
        <input type="range" id="opacityInput" min="0" max="1" step="0.05" value="0.7" oninput="updateUI()" style="margin-bottom:10px;">
        <input type="color" id="customColor" value="#ff6b81" onchange="changeColor(this.value)">
    </div>

    <button class="btn-save" onclick="saveAsImage()">EXTRACT PNG</button>
</div>

<div class="preview-area">
    <div class="card" id="export-card">
        <div class="overlay">
            <header>
                <div class="sys-log"><span id="view-affil">Fearless&bull;HQ</span><div class="sys-load-bar"></div></div>
                <div class="title-box">
                    <span class="grade" id="view-grade">S+ CLASS SENTINEL</span>
                    <h1 class="code-name-wrap" id="view-name">CODE NAME: LOVE</h1>
                </div>
            </header>
            <main>
                <div class="quote-card-unit"><span class="card-catch">// SYSTEM_QUOTE</span><p class="card-quote" id="view-quote">"어쩌고"</p></div>
                <div class="data-row"><span class="label">APPEARANCE</span><div class="value" id="view-app">키 181cm...</div></div>
                <div class="data-row"><span class="label">PERSONALITY</span><div class="value" id="view-pers">태생적으로 사랑받는...</div></div>
            </main>
            <footer><span>STATUS: STABLE_ACTIVE</span><div class="sys-beat"></div><span>ENCRYPTION: ACTIVE</span></footer>
        </div>
    </div>
</div>

<script>
    function toggleCardMode() {
        document.getElementById('export-card').classList.toggle('card-dark-mode');
    }

    function handleFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('export-card').style.backgroundImage = `url('${e.target.result}')`;
            reader.readAsDataURL(input.files[0]);
        }
    }

    function updateUI() {
        document.getElementById('view-affil').innerText = document.getElementById('affilInput').value;
        document.getElementById('view-grade').innerText = document.getElementById('gradeInput').value;
        document.getElementById('view-name').innerText = document.getElementById('nameInput').value;
        document.getElementById('view-quote').innerText = document.getElementById('quoteInput').value;
        document.getElementById('view-app').innerText = document.getElementById('appInput').value;
        document.getElementById('view-pers').innerText = document.getElementById('persInput').value;
        document.documentElement.style.setProperty('--bg-opacity', document.getElementById('opacityInput').value);
    }

    function changeColor(color) {
        document.documentElement.style.setProperty('--main-color', color);
        updateUI();
    }

    function saveAsImage() {
        domtoimage.toPng(document.getElementById('export-card')).then(url => {
            const link = document.createElement('a');
            link.download = 'card.png'; link.href = url; link.click();
        });
    }
</script>
</body>
</html>
