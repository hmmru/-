<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGD INTERFACE MAKER</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --main-blue: #3b82f6; --main-rgb: 59, 130, 246; }
        body { background: #0f172a; color: #fff; margin: 0; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        /* 1. 편집기 영역 */
        .editor-side { width: 420px; background: #1e293b; padding: 20px; overflow-y: auto; border-right: 1px solid #334155; z-index: 10; }
        .editor-side h2 { font-size: 13px; color: var(--main-blue); letter-spacing: 2px; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        .edit-group { margin-bottom: 15px; }
        .edit-group label { display: block; font-size: 11px; color: var(--main-blue); font-weight: bold; margin-bottom: 5px; }
        .edit-group input, .edit-group textarea { width: 100%; background: #020617; border: 1px solid #334155; color: #cbd5e1; padding: 10px; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        .edit-group textarea { height: 100px; resize: none; line-height: 1.6; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
        .btn-blue { background: var(--main-blue); color: #fff; }
        .btn-dark { background: #334155; color: #fff; }

        /* 2. 프리뷰 영역 */
        .preview-side { flex: 1; display: flex; justify-content: center; align-items: flex-start; background: #000; overflow-y: auto; padding: 40px; }

        /* 3. 원본 디자인 카드 (디자인 보존) */
        #capture-area {
            margin: 0 auto; max-width: 480px; font-family: 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif;
            background: #020617; 
            background-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.8) 150px, transparent 250px),
                              linear-gradient(rgba(var(--main-rgb), 0.08) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(var(--main-rgb), 0.08) 1px, transparent 1px),
                              radial-gradient(circle at 50% 100%, rgba(var(--main-rgb), 0.3) 0%, #020617 85%);
            background-size: 100% 100%, 25px 25px, 25px 25px, 100% 100%;
            border: 1px solid #1e293b; border-top: 3px solid var(--main-blue); border-radius: 20px;
            padding: 60px 25px; color: #94a3b8; box-sizing: border-box; position: relative; overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
        }

        /* 화이트 모드 전환용 */
        #capture-area.light-mode { background: #ffffff; background-image: none; color: #475569; border: 1px solid #e2e8f0; border-top: 3px solid var(--main-blue); }
        #capture-area.light-mode .content-div, #capture-area.light-mode .stat-div { background: rgba(var(--main-rgb), 0.05) !important; color: #334155 !important; }

        .corner { position: absolute; width: 15px; height: 15px; border: 2px solid var(--main-blue); opacity: 0.6; pointer-events: none; }
        .top-l { top: 25px; left: 25px; border-right: 0; border-bottom: 0; }
        .top-r { top: 25px; right: 25px; border-left: 0; border-bottom: 0; }
        .bot-l { bottom: 25px; left: 25px; border-right: 0; border-top: 0; }
        .bot-r { bottom: 25px; right: 25px; border-left: 0; border-top: 0; }

        .header-tag { font-size: 10px; color: var(--main-blue); letter-spacing: 5px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 10px rgba(var(--main-rgb), 0.5); text-align: center; }
        .img-container { margin: 0 auto; width: 100%; text-align: center; }
        .img-container img { max-width: 100%; height: auto; }

        .section-h { font-weight: bold; color: #f8fafc; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center; }
        #capture-area.light-mode .section-h { color: #1e293b; }
        .section-h span { color: var(--main-blue); margin-right: 12px; font-size: 18px; }

        .content-div { font-size: 14px; text-align: justify; color: #cbd5e1; line-height: 1.8; border-left: 2px solid var(--main-blue); padding: 10px 18px; margin-bottom: 10px; background: rgba(var(--main-rgb), 0.05); word-break: keep-all; }
        .panel-div { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(var(--main-rgb), 0.2); border-radius: 15px; padding: 30px 18px; backdrop-filter: blur(10px); margin-top: 35px; }
        .panel-title { font-size: 14px; color: #ffffff; font-weight: bold; border-bottom: 1px solid rgba(var(--main-rgb), 0.2); padding-bottom: 8px; margin-bottom: 12px; }
        #capture-area.light-mode .panel-title { color: #1e293b; }
        .panel-body { font-size: 13.5px; color: #94a3b8; line-height: 1.7; white-space: pre-wrap; }

        .stat-div { background: rgba(var(--main-rgb), 0.1); border: 1px dashed var(--main-blue); padding: 18px; border-radius: 12px; margin-top: 15px; color: #cbd5e1; }
        .stat-h { font-size: 14px; color: var(--main-blue); font-weight: bold; margin-bottom: 10px; }
        .stat-body { font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; }

        .pair-box { background: #020617; border: 1px solid rgba(var(--main-rgb), 0.3); padding: 22px; border-radius: 15px; text-align: center; margin-top: 30px; }
        #capture-area.light-mode .pair-box { background: #f1f5f9; }
    </style>
</head>
<body>

<div class="editor-side">
    <h2>FGD SYSTEM CONTROL</h2>
    
    <div class="edit-group">
        <label>1. THEME & MODE</label>
        <div style="display:flex; gap:10px;">
            <input type="color" id="color-picker" value="#3b82f6" oninput="updateAll()">
            <button class="btn btn-dark" onclick="toggleBG()" style="margin:0">DARK/LIGHT</button>
        </div>
    </div>

    <div class="edit-group">
        <label>2. IMAGE (URL or UPLOAD)</label>
        <input type="text" id="img-url" placeholder="Paste URL here..." oninput="updateImg(this.value)">
        <input type="file" accept="image/*" onchange="previewFile(this)" style="margin-top:5px; font-size:10px;">
    </div>

    <div class="edit-group">
        <label>3. HEADER & WORLDVIEW</label>
        <input type="text" id="in-tag" value="Fearless Global Division :: FGD" oninput="updateAll()">
        <textarea id="in-world" oninput="updateAll()" style="margin-top:5px;">2XX4년 04월 15일. 거대 게이트 최초 출현. 사망자 17,428명... 이후 대한민국은 완전히 뒤바뀌었다.</textarea>
    </div>

    <div class="edit-group">
        <label>4. BRANCH & SYSTEM</label>
        <textarea id="in-branch" oninput="updateAll()">한국 지부 [Fearless]&#10;"뼈를 삼키고, 살을 불태우며, 숨을 이어."&#10;&#10;현재 대한민국 평화의 중심은 피어리스 입니다.</textarea>
    </div>

    <div class="edit-group">
        <label>5. STAT DATA (SENTINEL/GUIDE)</label>
        <textarea id="in-stats" oninput="updateAll()">[센티넬] 초능력자. 각성해 능력을 얻는다.&#10;E:35% D:30% C:20% B:10% A:4% S:1%&#10;&#10;[가이드] 안정과 치유를 담당한다.&#10;E:50% D:25% C:15% B:8% A:2% S:미비</textarea>
    </div>

    <button class="btn btn-blue" onclick="saveImage()">SAVE AS HI-RES JPG</button>
    <button class="btn btn-dark" onclick="copyHTML()">COPY HTML CODE</button>
</div>

<div class="preview-side">
    <div id="capture-area">
        <div class="corner top-l"></div><div class="corner top-r"></div><div class="corner bot-l"></div><div class="corner bot-r"></div>
        
        <div style="position: relative; z-index: 2;">
            <div class="header-tag" id="out-tag"></div>
            <div class="img-container">
                <img id="out-img" src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2F4EqNB%2FdJMcahYuluP%2FAAAAAAAAAAAAAAAAAAAAAPnbjATaPuvdc7dnnFh9UyESa_7w2An_O2CjMlCy_GuJ%2Fimg.png">
            </div>
            <div style="width: 40px; height: 1px; background: var(--main-blue); margin: 30px auto; opacity: 0.6;"></div>

            <div class="section-h"><span>◈</span>세계관</div>
            <div class="content-div" id="out-world"></div>

            <div class="panel-div">
                <div class="panel-body" id="out-branch" style="font-weight:bold;"></div>
            </div>

            <div class="stat-div">
                <div class="stat-body" id="out-stats"></div>
            </div>

            <div class="pair-box">
                <div style="font-size: 10px; color: var(--main-blue); letter-spacing: 4px; margin-bottom: 10px; font-weight: bold;">PAIRING ANALYSIS</div>
                <div style="font-size: 15px; color: #fff; font-weight: bold; margin-bottom: 8px;">[페어링 시스템]</div>
                <div style="font-size: 13.5px; color: #94a3b8;"><b>[센티넬&가이드]</b>가 기본이지만, [센티넬&센티넬] 페어도 존재한다.</div>
            </div>
        </div>

        <div style="margin-top: 40px; text-align: center; opacity: 0.4;">
            <div style="font-size: 8px; color: var(--main-blue); letter-spacing: 2px;">FEARLESS ACCESS // DATA_REF_KR_2026</div>
        </div>
    </div>
</div>

<script>
    function toggleBG() { document.getElementById('capture-area').classList.toggle('light-mode'); }
    function updateImg(val) { if(val) document.getElementById('out-img').src = val; }
    function previewFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('out-img').src = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return `${r}, ${g}, ${b}`;
    }
    function updateAll() {
        const color = document.getElementById('color-picker').value;
        document.documentElement.style.setProperty('--main-blue', color);
        document.documentElement.style.setProperty('--main-rgb', hexToRgb(color));
        
        document.getElementById('out-tag').innerText = document.getElementById('in-tag').value;
        document.getElementById('out-world').innerText = document.getElementById('in-world').value;
        document.getElementById('out-branch').innerText = document.getElementById('in-branch').value;
        document.getElementById('out-stats').innerText = document.getElementById('in-stats').value;
    }
    function saveImage() {
        const target = document.getElementById('capture-area');
        html2canvas(target, { scale: 3, useCORS: true, backgroundColor: null }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'FGD_DOCUMENT.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        });
    }
    function copyHTML() {
        const code = document.getElementById('capture-area').outerHTML;
        navigator.clipboard.writeText(code).then(() => alert("카드 HTML 코드가 복사되었습니다!"));
    }
    updateAll();
</script>
</body>
</html>
