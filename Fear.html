<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGD INTERFACE MAKER</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { --main-blue: #3b82f6; --main-rgb: 59, 130, 246; }
        body { background: #0f172a; color: #fff; margin: 0; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        /* 왼쪽 편집기 */
        .editor { width: 420px; background: #1e293b; padding: 20px; overflow-y: auto; border-right: 1px solid #334155; z-index: 10; }
        .editor h2 { font-size: 14px; color: var(--main-blue); letter-spacing: 2px; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        .edit-group { margin-bottom: 15px; }
        .edit-group label { display: block; font-size: 11px; color: var(--main-blue); font-weight: bold; margin-bottom: 5px; }
        .edit-group input, .edit-group textarea { width: 100%; background: #020617; border: 1px solid #334155; color: #cbd5e1; padding: 10px; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
        .edit-group textarea { height: 80px; resize: none; line-height: 1.6; }
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
        .btn-blue { background: var(--main-blue); color: #fff; }
        .btn-dark { background: #334155; color: #fff; }

        /* 오른쪽 프리뷰 */
        .preview { flex: 1; display: flex; justify-content: center; align-items: flex-start; background: #000; overflow-y: auto; padding: 40px; }

        /* [FGD 원본 디자인 - 절대 수정 금지] */
        #capture-area {
            width: 480px; min-height: 1000px; padding: 60px 25px; box-sizing: border-box; position: relative; overflow: hidden;
            background: #020617; border: 1px solid #1e293b; border-top: 3px solid var(--main-blue); border-radius: 20px;
            background-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.8) 150px, transparent 250px),
                              linear-gradient(rgba(var(--main-rgb), 0.08) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(var(--main-rgb), 0.08) 1px, transparent 1px),
                              radial-gradient(circle at 50% 100%, rgba(var(--main-rgb), 0.2) 0%, #020617 85%);
            background-size: 100% 100%, 25px 25px, 25px 25px, 100% 100%;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9); transition: 0.3s;
        }
        #capture-area.light-mode { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; border-top: 3px solid var(--main-blue); background-image: none; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        #capture-area.light-mode .content-box, #capture-area.light-mode .stat-box { background: rgba(var(--main-rgb), 0.05); color: #334155; }
        #capture-area.light-mode .info-panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(var(--main-rgb), 0.2); }

        .corner { position: absolute; width: 15px; height: 15px; border: 2px solid var(--main-blue); opacity: 0.6; pointer-events: none; }
        .top-l { top: 25px; left: 25px; border-right: 0; border-bottom: 0; }
        .top-r { top: 25px; right: 25px; border-left: 0; border-bottom: 0; }
        .bot-l { bottom: 25px; left: 25px; border-right: 0; border-top: 0; }
        .bot-r { bottom: 25px; right: 25px; border-left: 0; border-top: 0; }

        .fgd-tag { text-align: center; font-size: 10px; color: var(--main-blue); letter-spacing: 5px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 10px rgba(var(--main-rgb), 0.5); }
        .main-img-wrap { width: 100%; text-align: center; margin-bottom: 30px; }
        .main-img-wrap img { max-width: 100%; height: auto; }

        .section-title { font-weight: bold; color: #f8fafc; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center; }
        #capture-area.light-mode .section-title { color: #1e293b; }
        .section-title span { color: var(--main-blue); margin-right: 12px; }

        .content-box { font-size: 14px; text-align: justify; color: #cbd5e1; line-height: 1.8; border-left: 2px solid var(--main-blue); padding: 10px 18px; margin-bottom: 45px; background: rgba(var(--main-rgb), 0.05); word-break: keep-all; }
        .info-panel { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(var(--main-rgb), 0.2); border-radius: 15px; padding: 30px 18px; backdrop-filter: blur(10px); margin-bottom: 35px; }
        .panel-h { font-size: 14px; color: #ffffff; font-weight: bold; border-bottom: 1px solid rgba(var(--main-rgb), 0.2); padding-bottom: 8px; margin-bottom: 12px; }
        #capture-area.light-mode .panel-h { color: #1e293b; }
        .panel-body { font-size: 13.5px; color: #94a3b8; line-height: 1.7; white-space: pre-wrap; }

        .stat-box { background: rgba(var(--main-rgb), 0.1); border: 1px dashed var(--main-blue); padding: 18px; border-radius: 12px; margin-bottom: 15px; }
        .stat-h { font-size: 14px; color: var(--main-blue); font-weight: bold; margin-bottom: 10px; }
        .stat-body { font-size: 12.5px; color: #cbd5e1; line-height: 1.7; white-space: pre-wrap; }

        .pair-box { background: rgba(2, 6, 23, 0.5); border: 1px solid rgba(var(--main-rgb), 0.3); padding: 22px; border-radius: 15px; text-align: center; }
        footer { margin-top: 40px; text-align: center; opacity: 0.4; font-size: 8px; color: var(--main-blue); letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="editor">
    <h2>FGD INTERFACE CONTROL</h2>
    
    <div class="edit-group">
        <label>THEME COLOR & MODE</label>
        <div class="row">
            <input type="color" id="c-theme" value="#3b82f6" oninput="up()">
            <button class="btn btn-dark" onclick="toggleMode()">DARK/LIGHT</button>
        </div>
    </div>

    <div class="edit-group">
        <label>LOGO IMAGE (URL or FILE)</label>
        <input type="text" id="i-img-url" placeholder="Image URL..." oninput="upImg(this.value)">
        <input type="file" accept="image/*" onchange="loadFile(this)" style="margin-top:5px">
    </div>

    <div class="edit-group"><label>TOP TAG</label><input type="text" id="in-tag" value="Fearless Global Division :: FGD" oninput="up()"></div>
    <div class="edit-group"><label>WORLDVIEW</label><textarea id="in-world" oninput="up()">2XX4년 04월 15일. 거대 게이트 최초 출현...&#10;&#10;어느 날 차원 문이 열려 이세계 빌런들이 쏟아진다. 같은 시각 극소수의 사람들이 센티넬과 가이드로 발현된다.</textarea></div>
    <div class="edit-group"><label>BRANCH INFO</label><textarea id="in-branch" oninput="up()">"뼈를 삼키고, 살을 불태우며, 숨을 이어. 너에게 내일을 약속하지."&#10;&#10;현재 대한민국 평화의 중심은 피어리스 입니다.</textarea></div>
    <div class="edit-group"><label>SENTINEL/GUIDE DATA</label><textarea id="in-s-data" oninput="up()">[센티넬]&#10;각성해 능력을 얻게 되며 신체 능력이 일반인보다 월등히 뛰어나다.&#10;&#10;¤ 등급 비율&#10;E:35% D:30% C:20% B:10% A:4% S:1%</textarea></div>
    <div class="edit-group"><label>PAIRING SYSTEM</label><input type="text" id="in-pair" value="[센티넬&가이드]가 기본이지만, [센티넬&센티넬] 페어도 존재한다." oninput="up()"></div>

    <button class="btn btn-blue" onclick="saveJpg()">SAVE AS HI-RES JPG</button>
    <button class="btn btn-dark" onclick="copyCode()">COPY HTML CODE</button>
</div>

<div class="preview">
    <div id="capture-area">
        <div class="corner top-l"></div><div class="corner top-r"></div><div class="corner bot-l"></div><div class="corner bot-r"></div>
        
        <div class="fgd-tag" id="out-tag"></div>
        
        <div class="main-img-wrap">
            <img id="out-img" src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2F4EqNB%2FdJMcahYuluP%2FAAAAAAAAAAAAAAAAAAAAAPnbjATaPuvdc7dnnFh9UyESa_7w2An_O2CjMlCy_GuJ%2Fimg.png">
        </div>

        <div class="section-title"><span>◈</span>세계관</div>
        <div class="content-box" id="out-world"></div>

        <div class="info-panel">
            <div class="panel-h">한국 지부 <span style="color: var(--main-blue);">[Fearless]</span></div>
            <div class="panel-body" id="out-branch"></div>
        </div>

        <div class="stat-box">
            <div class="stat-body" id="out-s-data"></div>
        </div>

        <div class="pair-box">
            <div style="font-size: 10px; color: var(--main-blue); letter-spacing: 4px; margin-bottom: 10px; font-weight: bold;">PAIRING ANALYSIS</div>
            <div style="font-size: 15px; font-weight: bold; margin-bottom: 8px;">[페어링 시스템]</div>
            <div style="font-size: 13.5px;" id="out-pair"></div>
        </div>

        <footer>FEARLESS ACCESS // DATA_REF_KR_2026</footer>
    </div>
</div>

<script>
    function toggleMode() { document.getElementById('capture-area').classList.toggle('light-mode'); }
    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return `${r}, ${g}, ${b}`;
    }
    function upImg(url) { if(url) document.getElementById('out-img').src = url; }
    function loadFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('out-img').src = e.target.result; };
            reader.readAsDataURL(input.files[0]);
        }
    }
    function up() {
        const color = document.getElementById('c-theme').value;
        document.documentElement.style.setProperty('--main-blue', color);
        document.documentElement.style.setProperty('--main-rgb', hexToRgb(color));
        
        document.getElementById('out-tag').innerText = document.getElementById('in-tag').value;
        document.getElementById('out-world').innerText = document.getElementById('in-world').value;
        document.getElementById('out-branch').innerText = document.getElementById('in-branch').value;
        document.getElementById('out-s-data').innerText = document.getElementById('in-s-data').value;
        document.getElementById('out-pair').innerText = document.getElementById('in-pair').value;
    }
    function saveJpg() {
        html2canvas(document.getElementById('capture-area'), { scale: 3, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'FGD_CARD.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });
    }
    function copyCode() {
        const code = document.documentElement.outerHTML;
        navigator.clipboard.writeText(code).then(() => alert("HTML 코드가 복사되었습니다!"));
    }
    up();
</script>
</body>
</html>
