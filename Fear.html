<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FGD WORLD-VIEW MAKER</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #000; color: #eee; font-family: sans-serif; overflow: hidden; }
        /* 에디터 사이드바 */
        .editor { width: 380px; background: #111; border-right: 1px solid #333; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .editor h2 { font-size: 14px; color: #3b82f6; letter-spacing: 2px; margin: 0 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 11px; font-weight: bold; color: #3b82f6; }
        .field input, .field textarea { background: #050505; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; font-size: 12px; outline: none; }
        .field textarea { height: 120px; resize: none; line-height: 1.6; }
        .btn-group { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-blue { background: #3b82f6; color: #fff; }
        .btn-dark { background: #222; color: #ccc; }
        
        /* 프리뷰 영역 */
        .preview { flex: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        #ORIGINAL_FRAME { transform-origin: top center; }
    </style>
</head>
<body>

<div class="editor">
    <h2>FGD INTERFACE</h2>
    
    <div class="field">
        <label>THEME COLOR (BORDER/TEXT)</label>
        <input type="color" id="colorInput" value="#3b82f6" oninput="applySettings()">
    </div>

    <div class="field">
        <label>LOGO IMAGE URL</label>
        <input type="text" id="imgInput" placeholder="이미지 주소 붙여넣기" oninput="applySettings()">
    </div>

    <div class="field">
        <label>1. 세계관 (내용 수정)</label>
        <textarea id="worldInput" oninput="applySettings()">2XX4년 04월 15일. 거대 게이트 최초 출현. 사망자 17,428명, 부상자 63,917명, 실종자: 3,206명. 이후, 대한민국은 완전히 뒤바뀌었다.&#10;&#10;어느 날 차원 문이 열려 이세계 빌런들이 쏟아진다. 같은 시각 극소수의 사람들이 센티넬과 가이드로 발현된다. 전 세계는 큰 혼란에 빠졌지만, 한국의 발 빠른 대처로 각 나라에 센티넬 지부를 설립. 그 후로 센티넬과 가이드를 국가에서 관리한다.</textarea>
    </div>

    <div class="field">
        <label>2. 한국지부 상세설명</label>
        <textarea id="branchInput" oninput="applySettings()">"뼈를 삼키고, 살을 불태우며, 숨을 이어. 너에게 내일을 약속하지. 이 건 너희들에게 속삭이는 모두의 이야기."&#10;&#10;현재 대한민국 평화의 중심은 피어리스 입니다.&#10;&#10;피어리스는 '내일' 이자 '평화', '미래'이자 '약속'입니다.</textarea>
    </div>

    <div class="btn-group">
        <button class="btn btn-blue" onclick="downloadJpg()">고화질 JPG 저장</button>
        <button class="btn btn-dark" onclick="copyCode()">수정된 코드 복사</button>
        <button class="btn btn-dark" onclick="toggleMode()">다크 / 화이트 전환</button>
    </div>
</div>

<div class="preview">
    <div id="ORIGINAL_FRAME" style="margin: 0 auto; max-width: 480px; font-family: 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif; background: #020617; background-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.8) 150px, transparent 250px),        linear-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px),        linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),        radial-gradient(circle at 50% 100%, #1e3a8a 0%, #020617 85%); background-size: 100% 100%, 25px 25px, 25px 25px, 100% 100%; border: 1px solid #1e293b; border-top: 3px solid #3b82f6; border-radius: 20px; padding: 60px 25px; color: #94a3b8; box-sizing: border-box; position: relative; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.9);">
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.6;">
    <div class="theme-border" style="position: absolute; top: 25px; left: 25px; width: 15px; height: 15px; border-top: 2px solid #3b82f6; border-left: 2px solid #3b82f6;">&nbsp;</div>
    <div class="theme-border" style="position: absolute; top: 25px; right: 25px; width: 15px; height: 15px; border-top: 2px solid #3b82f6; border-right: 2px solid #3b82f6;">&nbsp;</div>
    <p data-ke-size="size16">&nbsp;</p>
    <div class="theme-border" style="position: absolute; bottom: 25px; left: 25px; width: 15px; height: 15px; border-bottom: 2px solid #3b82f6; border-left: 2px solid #3b82f6;">&nbsp;</div>
    <div class="theme-border" style="position: absolute; bottom: 25px; right: 25px; width: 15px; height: 15px; border-bottom: 2px solid #3b82f6; border-right: 2px solid #3b82f6;">&nbsp;</div>
    </div>
    <div style="position: relative; z-index: 2;">
    <div style="text-align: center; margin-bottom: 50px;">
    <div class="theme-text" style="font-size: 10px; color: #3b82f6; letter-spacing: 5px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);">Fearless Global Division :: FGD</div>
    <div style="margin: 0 auto; width: 100%;"><img id="outImg" src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2F4EqNB%2FdJMcahYuluP%2FAAAAAAAAAAAAAAAAAAAAAPnbjATaPuvdc7dnnFh9UyESa_7w2An_O2CjMlCy_GuJ%2Fimg.png" style="max-width:100%;"></div>
    <div class="theme-line" style="width: 40px; height: 1px; background: #2563eb; margin: 30px auto; opacity: 0.6;">&nbsp;</div>
    </div>
    <div style="margin-bottom: 45px;">
    <div style="font-weight: bold; color: #f8fafc; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center;"><span class="theme-text" style="color: #3b82f6; margin-right: 12px; font-size: 18px;">◈</span>세계관</div>
    <div id="outWorld" style="font-size: 14px; text-align: justify; color: #cbd5e1; line-height: 1.8; border-left: 2px solid #3b82f6; padding-left: 18px; word-break: keep-all; background: rgba(30, 58, 138, 0.05); padding-top: 10px; padding-bottom: 10px; white-space: pre-wrap;"></div>
    </div>
    <div style="background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 15px; padding: 30px 18px; backdrop-filter: blur(10px);">
    <div style="margin-bottom: 35px;">
    <div style="padding: 0 5px; margin-bottom: 12px; border-bottom: 1px solid rgba(59, 130, 246, 0.2); padding-bottom: 8px;">
    <div style="font-size: 14px; color: #ffffff; font-weight: bold; text-align: left;">한국 지부 <span class="theme-text" style="color: #3b82f6;">[Fearless]</span></div>
    </div>
    <div id="outBranch" style="padding-left: 5px; font-size: 13.5px; color: #94a3b8; line-height: 1.7; text-align: left; white-space: pre-wrap;"></div>
    </div>
    <div style="background: rgba(30, 58, 138, 0.1); border: 1px dashed #3b82f6; padding: 18px; border-radius: 12px; margin-bottom: 15px;">
    <div class="theme-text" style="font-size: 14px; color: #3b82f6; font-weight: bold; margin-bottom: 10px;">[센티넬]</div>
    <div style="font-size: 12.5px; color: #cbd5e1; line-height: 1.7;">초능력자. 각성해 능력을 얻게 되며 신체 능력이 일반인보다 월등히 뛰어나다. 약물을 통해 부작용을 통제하지만 가이드에게 가이딩을 받아야 한다.</div>
    </div>
    <div style="background: rgba(30, 58, 138, 0.1); border: 1px dashed #3b82f6; padding: 18px; border-radius: 12px; margin-bottom: 30px;">
    <div class="theme-text" style="font-size: 14px; color: #3b82f6; font-weight: bold; margin-bottom: 10px;">[가이드]</div>
    <div style="font-size: 12.5px; color: #cbd5e1; line-height: 1.7;">센티넬의 안정과 치유를 담당하며 폭주을 막을 수 있는 유일한 사람들.</div>
    </div>
    <div class="theme-border" style="background: #020617; border: 1px solid rgba(59, 130, 246, 0.3); padding: 22px; border-radius: 15px; text-align: center; box-shadow: inset 0 0 15px rgba(37, 99, 235, 0.1);">
    <div class="theme-text" style="font-size: 10px; color: #3b82f6; letter-spacing: 4px; margin-bottom: 10px; font-weight: bold;">PAIRING ANALYSIS</div>
    <div style="font-size: 15px; color: #ffffff; font-weight: bold; margin-bottom: 8px;">[페어링 시스템]</div>
    <div style="font-size: 13.5px; color: #94a3b8; line-height: 1.6;"><b>[센티넬&amp;가이드]</b>가 기본이다.</div>
    </div>
    </div>
    </div>
    <div style="margin-top: 40px; text-align: center; opacity: 0.4;">
    <div class="theme-text" style="font-size: 8px; color: #3b82f6; letter-spacing: 2px;">FEARLESS ACCESS // DATA_REF_KR_2026</div>
    </div>
    </div>
    </div>

<script>
    function applySettings() {
        const color = document.getElementById('colorInput').value;
        const img = document.getElementById('imgInput').value;
        const world = document.getElementById('worldInput').value;
        const branch = document.getElementById('branchInput').value;

        // 원본 프레임 상단 테두리 색상 교체
        document.getElementById('ORIGINAL_FRAME').style.borderTopColor = color;
        
        // 이미지 교체
        if(img) document.getElementById('outImg').src = img;

        // 텍스트 교체 (줄바꿈 포함)
        document.getElementById('outWorld').innerText = world;
        document.getElementById('outBranch').innerText = branch;

        // 테마 색상 일괄 적용 (클래스 기반)
        document.querySelectorAll('.theme-text').forEach(el => el.style.color = color);
        document.querySelectorAll('.theme-line').forEach(el => el.style.backgroundColor = color);
        document.querySelectorAll('.theme-border').forEach(el => {
            if(el.style.borderTop) el.style.borderTopColor = color;
            if(el.style.borderLeft) el.style.borderLeftColor = color;
            if(el.style.borderRight) el.style.borderRightColor = color;
            if(el.style.borderBottom) el.style.borderBottomColor = color;
            if(el.style.border) el.style.borderColor = color;
        });
        document.getElementById('outWorld').style.borderLeftColor = color;
    }

    function toggleMode() {
        const frame = document.getElementById('ORIGINAL_FRAME');
        if(frame.style.background === 'rgb(2, 6, 23)' || frame.style.background === '#020617') {
            frame.style.background = '#ffffff';
            frame.style.backgroundImage = 'none';
            frame.style.color = '#333';
        } else {
            frame.style.background = '#020617';
            frame.style.backgroundImage = 'linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.8) 150px, transparent 250px), linear-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px), radial-gradient(circle at 50% 100%, #1e3a8a 0%, #020617 85%)';
            frame.style.color = '#94a3b8';
        }
    }

    function downloadJpg() {
        html2canvas(document.getElementById('ORIGINAL_FRAME'), { scale: 3, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'FGD_ORIGINAL_CARD.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });
    }

    function copyCode() {
        const code = document.getElementById('ORIGINAL_FRAME').outerHTML;
        navigator.clipboard.writeText(code).then(() => alert("원본 구조가 유지된 코드가 복사되었습니다."));
    }

    applySettings();
</script>
</body>
</html>
