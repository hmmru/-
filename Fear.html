<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FGD ORIGINAL MAKER</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #000; color: #fff; font-family: sans-serif; }
        /* 편집바 */
        .editor-bar { width: 400px; background: #111; border-right: 1px solid #333; padding: 20px; overflow-y: auto; z-index: 100; }
        .edit-item { margin-bottom: 15px; }
        .edit-item label { display: block; font-size: 11px; color: #3b82f6; margin-bottom: 5px; font-weight: bold; }
        .edit-item input, .edit-item textarea { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; box-sizing: border-box; }
        .edit-item textarea { height: 100px; resize: none; font-size: 13px; }
        .btn-zone { margin-top: 20px; }
        .btn { width: 100%; padding: 12px; border: none; cursor: pointer; font-weight: bold; margin-bottom: 10px; border-radius: 4px; }
        .btn-save { background: #3b82f6; color: #fff; }
        .btn-copy { background: #333; color: #fff; }
        /* 프리뷰 */
        .preview-zone { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 40px; overflow-y: auto; background: #050505; }
    </style>
</head>
<body>

<div class="editor-bar">
    <h2 style="font-size: 14px; color: #3b82f6; letter-spacing: 2px;">FGD EDITOR (ORIGINAL)</h2>
    
    <div class="edit-item">
        <label>테마 컬러</label>
        <input type="color" id="themeColor" value="#3b82f6" oninput="changeTheme()">
    </div>

    <div class="edit-item">
        <label>로고 이미지 URL</label>
        <input type="text" id="logoUrl" oninput="syncText()">
    </div>

    <div class="edit-item">
        <label>상단 태그</label>
        <input type="text" id="topTag" value="Fearless Global Division :: FGD" oninput="syncText()">
    </div>

    <div class="edit-item">
        <label>세계관 텍스트 (줄바꿈 반영)</label>
        <textarea id="worldText" oninput="syncText()">2XX4년 04월 15일. 거대 게이트 최초 출현. 사망자 17,428명, 부상자 63,917명, 실종자: 3,206명. 이후, 대한민국은 완전히 뒤바뀌었다.&#10;&#10;어느 날 차원 문이 열려 이세계 빌런들이 쏟아진다. 같은 시각 극소수의 사람들이 센티넬과 가이드로 발현된다.</textarea>
    </div>

    <div class="edit-item">
        <label>지부 상세 내용</label>
        <textarea id="branchText" oninput="syncText()">"뼈를 삼키고, 살을 불태우며, 숨을 이어. 너에게 내일을 약속하지. 이건 너희들에게 속삭이는 모두의 이야기."&#10;&#10;현재 대한민국 평화의 중심은 피어리스 입니다.</textarea>
    </div>

    <div class="btn-zone">
        <button class="btn btn-save" onclick="exportJpg()">고화질 JPG 저장</button>
        <button class="btn btn-copy" onclick="copyFinalCode()">최종 코드 복사</button>
    </div>
</div>

<div class="preview-zone">
    <div id="original-card" style="margin: 0 auto; width: 480px; font-family: 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif; background: #020617; background-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.8) 150px, transparent 250px), linear-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px), radial-gradient(circle at 50% 100%, #1e3a8a 0%, #020617 85%); background-size: 100% 100%, 25px 25px, 25px 25px, 100% 100%; border: 1px solid #1e293b; border-top: 3px solid #3b82f6; border-radius: 20px; padding: 60px 25px; color: #94a3b8; box-sizing: border-box; position: relative; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.9);">
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.6;">
            <div class="c-border" style="position: absolute; top: 25px; left: 25px; width: 15px; height: 15px; border-top: 2px solid #3b82f6; border-left: 2px solid #3b82f6;">&nbsp;</div>
            <div class="c-border" style="position: absolute; top: 25px; right: 25px; width: 15px; height: 15px; border-top: 2px solid #3b82f6; border-right: 2px solid #3b82f6;">&nbsp;</div>
            <div class="c-border" style="position: absolute; bottom: 25px; left: 25px; width: 15px; height: 15px; border-bottom: 2px solid #3b82f6; border-left: 2px solid #3b82f6;">&nbsp;</div>
            <div class="c-border" style="position: absolute; bottom: 25px; right: 25px; width: 15px; height: 15px; border-bottom: 2px solid #3b82f6; border-right: 2px solid #3b82f6;">&nbsp;</div>
        </div>
        <div style="position: relative; z-index: 2;">
            <div style="text-align: center; margin-bottom: 50px;">
                <div id="view-tag" style="font-size: 10px; color: #3b82f6; letter-spacing: 5px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);">Fearless Global Division :: FGD</div>
                <div style="margin: 0 auto; width: 100%;"><img id="view-img" src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2F4EqNB%2FdJMcahYuluP%2FAAAAAAAAAAAAAAAAAAAAAPnbjATaPuvdc7dnnFh9UyESa_7w2An_O2CjMlCy_GuJ%2Fimg.png" style="max-width:100%;"></div>
                <div class="c-line" style="width: 40px; height: 1px; background: #2563eb; margin: 30px auto; opacity: 0.6;">&nbsp;</div>
            </div>
            <div style="margin-bottom: 45px;">
                <div style="font-weight: bold; color: #f8fafc; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center;"><span class="c-text" style="color: #3b82f6; margin-right: 12px; font-size: 18px;">◈</span>세계관</div>
                <div id="view-world" style="font-size: 14px; text-align: justify; color: #cbd5e1; line-height: 1.8; border-left: 2px solid #3b82f6; padding: 10px 18px; word-break: keep-all; background: rgba(30, 58, 138, 0.05); white-space: pre-wrap;"></div>
            </div>
            <div style="background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 15px; padding: 30px 18px; backdrop-filter: blur(10px);">
                <div style="font-size: 14px; color: #ffffff; font-weight: bold; border-bottom: 1px solid rgba(59, 130, 246, 0.2); padding-bottom: 8px; margin-bottom: 12px;">한국 지부 <span class="c-text" style="color: #3b82f6;">[Fearless]</span></div>
                <div id="view-branch" style="font-size: 13.5px; color: #94a3b8; line-height: 1.7; white-space: pre-wrap;"></div>
            </div>
            <div style="margin-top: 40px; text-align: center; opacity: 0.4;">
                <div class="c-text" style="font-size: 8px; color: #3b82f6; letter-spacing: 2px;">FEARLESS ACCESS // DATA_REF_KR_2026</div>
            </div>
        </div>
    </div>
    </div>

<script>
    function syncText() {
        document.getElementById('view-tag').innerText = document.getElementById('topTag').value;
        document.getElementById('view-world').innerText = document.getElementById('worldText').value;
        document.getElementById('view-branch').innerText = document.getElementById('branchText').value;
        if(document.getElementById('logoUrl').value) {
            document.getElementById('view-img').src = document.getElementById('logoUrl').value;
        }
    }

    function changeTheme() {
        const color = document.getElementById('themeColor').value;
        const card = document.getElementById('original-card');
        card.style.borderTopColor = color;
        document.querySelectorAll('.c-border').forEach(el => {
            if(el.style.borderTop) el.style.borderTopColor = color;
            if(el.style.borderLeft) el.style.borderLeftColor = color;
            if(el.style.borderRight) el.style.borderRightColor = color;
            if(el.style.borderBottom) el.style.borderBottomColor = color;
        });
        document.querySelectorAll('.c-text').forEach(el => el.style.color = color);
        document.getElementById('view-tag').style.color = color;
        document.getElementById('view-world').style.borderLeftColor = color;
    }

    function exportJpg() {
        html2canvas(document.getElementById('original-card'), { scale: 3, useCORS: true, backgroundColor: '#000' }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'FGD_CARD_ORIGINAL.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        });
    }

    function copyFinalCode() {
        const code = document.getElementById('original-card').outerHTML;
        navigator.clipboard.writeText(code).then(() => alert("원본 디자인 스타일이 유지된 코드가 복사되었습니다!"));
    }

    syncText();
</script>
</body>
</html>
