<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FGD INTERFACE MAKER</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #000; color: #eee; font-family: sans-serif; overflow: hidden; }
        .editor { width: 380px; background: #111; border-right: 1px solid #333; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .editor h2 { font-size: 14px; color: #3b82f6; letter-spacing: 2px; margin: 0 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 11px; font-weight: bold; color: #3b82f6; }
        .field input, .field textarea { background: #050505; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; font-size: 12px; outline: none; }
        .field textarea { height: 100px; resize: none; line-height: 1.6; }
        .btn-group { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-blue { background: #3b82f6; color: #fff; }
        .btn-dark { background: #222; color: #ccc; }
        .preview { flex: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; background: #050505; }
    </style>
</head>
<body>

<div class="editor">
    <h2>FGD CONTROL</h2>
    <div class="field"><label>테마 컬러</label><input type="color" id="colorInput" value="#3b82f6" oninput="apply()"></div>
    <div class="field"><label>로고 이미지 URL</label><input type="text" id="imgInput" oninput="apply()"></div>
    <div class="field"><label>세계관 내용</label><textarea id="worldInput" oninput="apply()">2XX4년 04월 15일. 거대 게이트 최초 출현... 이후, 대한민국은 완전히 뒤바뀌었다.</textarea></div>
    <div class="field"><label>지부 상세</label><textarea id="branchInput" oninput="apply()">"뼈를 삼키고, 살을 불태우며, 숨을 이어."&#10;&#10;대한민국 평화의 중심은 피어리스 입니다.</textarea></div>
    <div class="btn-group">
        <button class="btn btn-blue" onclick="download()">JPG 저장</button>
        <button class="btn btn-dark" onclick="copy()">코드 복사</button>
        <button class="btn btn-dark" onclick="toggleWhite()">상단 화이트 모드 전환</button>
    </div>
</div>

<div class="preview">
    <div id="ORIGINAL_FRAME" style="margin: 0; max-width: 480px; font-family: 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif; background: #020617; background-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.8) 150px, transparent 250px), linear-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px), radial-gradient(circle at 50% 100%, #1e3a8a 0%, #020617 85%); background-size: 100% 100%, 25px 25px, 25px 25px, 100% 100%; border: 1px solid #1e293b; border-top: 3px solid #3b82f6; border-radius: 20px; padding: 60px 25px; color: #94a3b8; box-sizing: border-box; position: relative; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.9);">
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.6;">
            <div class="t-border" style="position: absolute; top: 25px; left: 25px; width: 15px; height: 15px; border-top: 2px solid #3b82f6; border-left: 2px solid #3b82f6;"></div>
            <div class="t-border" style="position: absolute; top: 25px; right: 25px; width: 15px; height: 15px; border-top: 2px solid #3b82f6; border-right: 2px solid #3b82f6;"></div>
            <div class="t-border" style="position: absolute; bottom: 25px; left: 25px; width: 15px; height: 15px; border-bottom: 2px solid #3b82f6; border-left: 2px solid #3b82f6;"></div>
            <div class="t-border" style="position: absolute; bottom: 25px; right: 25px; width: 15px; height: 15px; border-bottom: 2px solid #3b82f6; border-right: 2px solid #3b82f6;"></div>
        </div>
        <div style="position: relative; z-index: 2;">
            <div style="text-align: center; margin-bottom: 40px;">
                <div class="t-text" style="font-size: 10px; color: #3b82f6; letter-spacing: 5px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);">Fearless Global Division :: FGD</div>
                <div style="margin: 0 auto; width: 100%;"><img id="outImg" src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2F4EqNB%2FdJMcahYuluP%2FAAAAAAAAAAAAAAAAAAAAAPnbjATaPuvdc7dnnFh9UyESa_7w2An_O2CjMlCy_GuJ%2Fimg.png" style="max-width:100%;"></div>
                <div class="t-line" style="width: 40px; height: 1px; background: #2563eb; margin: 30px auto; opacity: 0.6;"></div>
            </div>
            <div style="margin-bottom: 35px;">
                <div style="font-weight: bold; color: #f8fafc; font-size: 17px; margin-bottom: 15px; display: flex; align-items: center;"><span class="t-text" style="color: #3b82f6; margin-right: 12px; font-size: 18px;">◈</span>세계관</div>
                <div id="outWorld" style="font-size: 14px; text-align: justify; color: #cbd5e1; line-height: 1.8; border-left: 2px solid #3b82f6; padding-left: 18px; word-break: keep-all; background: rgba(30, 58, 138, 0.05); padding-top: 10px; padding-bottom: 10px; white-space: pre-wrap;"></div>
            </div>
            <div style="background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 15px; padding: 30px 18px; backdrop-filter: blur(10px); margin-bottom: 0;">
                <div style="margin-bottom: 20px;">
                    <div style="padding: 0 5px; margin-bottom: 12px; border-bottom: 1px solid rgba(59, 130, 246, 0.2); padding-bottom: 8px;">
                        <div style="font-size: 14px; color: #ffffff; font-weight: bold;">한국 지부 <span class="t-text" style="color: #3b82f6;">[Fearless]</span></div>
                    </div>
                    <div id="outBranch" style="padding-left: 5px; font-size: 13.5px; color: #94a3b8; line-height: 1.7; white-space: pre-wrap;"></div>
                </div>
                <div class="t-border" style="background: #020617; border: 1px solid rgba(59, 130, 246, 0.3); padding: 22px; border-radius: 15px; text-align: center;">
                    <div class="t-text" style="font-size: 10px; color: #3b82f6; letter-spacing: 4px; margin-bottom: 10px; font-weight: bold;">PAIRING ANALYSIS</div>
                    <div style="font-size: 15px; color: #ffffff; font-weight: bold;">[페어링 시스템]</div>
                </div>
            </div>
            <div style="margin-top: 30px; text-align: center; opacity: 0.4;">
                <div class="t-text" style="font-size: 8px; color: #3b82f6; letter-spacing: 2px;">FEARLESS ACCESS // DATA_REF_KR_2026</div>
            </div>
        </div>
    </div>
</div>

<script>
    let isWhite = false;
    function apply() {
        const c = document.getElementById('colorInput').value;
        const frame = document.getElementById('ORIGINAL_FRAME');
        frame.style.borderTopColor = c;
        if(document.getElementById('imgInput').value) document.getElementById('outImg').src = document.getElementById('imgInput').value;
        document.getElementById('outWorld').innerText = document.getElementById('worldInput').value;
        document.getElementById('outBranch').innerText = document.getElementById('branchInput').value;
        document.querySelectorAll('.t-text').forEach(el => el.style.color = c);
        document.querySelectorAll('.t-line').forEach(el => el.style.backgroundColor = c);
        document.querySelectorAll('.t-border').forEach(el => {
            ['top','left','right','bottom'].forEach(s => { if(el.style['border'+s.charAt(0).toUpperCase()+s.slice(1)]) el.style['border'+s.charAt(0).toUpperCase()+s.slice(1)+'Color'] = c; });
            if(el.style.border) el.style.borderColor = c;
        });
        document.getElementById('outWorld').style.borderLeftColor = c;
        updateBG();
    }
    function updateBG() {
        const frame = document.getElementById('ORIGINAL_FRAME');
        const gradTop = isWhite ? 'rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.5) 150px, transparent 250px' : '#000 0%, rgba(0,0,0,0.8) 150px, transparent 250px';
        frame.style.backgroundImage = `linear-gradient(to bottom, ${gradTop}), linear-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px), radial-gradient(circle at 50% 100%, #1e3a8a 0%, #020617 85%)`;
    }
    function toggleWhite() { isWhite = !isWhite; updateBG(); }
    function download() { html2canvas(document.getElementById('original-card') || document.getElementById('ORIGINAL_FRAME'), { scale: 3, useCORS: true }).then(c => { const a = document.createElement('a'); a.download = 'FGD.jpg'; a.href = c.toDataURL('image/jpeg', 0.95); a.click(); }); }
    function copy() { navigator.clipboard.writeText(document.getElementById('ORIGINAL_FRAME').outerHTML).then(() => alert("복사완료")); }
    apply();
</script>
</body>
</html>
